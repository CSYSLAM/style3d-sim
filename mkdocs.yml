site_name: Style3D Sim
repo_url: https://github.com/Style3D/style3d-sim
repo_name: Style3D/style3d-sim
site_description: Style3D Sim installation, authentication, simulation tutorials, and API reference.
docs_dir: docs
site_dir: site
strict: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
theme:
  name: material
  logo: images/logo.png
  icon:
    repo: fontawesome/brands/github
  language: zh
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - i18n:
      docs_structure: suffix
      # Share unsuffixed assets; check_docs.py requires translations for every page.
      fallback_to_default: true
      languages:
        - locale: zh
          name: 简体中文
          default: true
          site_description: Style3D Sim 安装、登录、仿真教程与 API 参考。
        - locale: en
          name: English
          nav_translations:
            首页: Home
            入门: Getting Started
            安装与构建: Installation and Build
            账号登录: Authentication
            第一个仿真: First Simulation
            使用教程: Guides
            模型、状态与仿真循环: Models, States, and Simulation Loop
            刚体、碰撞与关节: Rigid Bodies, Contacts, and Joints
            布料与四面体软体: Cloth and Tetrahedral Bodies
            粒子流体与颗粒材料: Fluids and Granular Materials
            参数调优与性能: Configuration and Performance
            示例与渲染: Demos and Rendering
            接口选择与索引: API Overview
            Python 适配层: Python Adapter
            原生绑定: Native Bindings
            维护: Maintenance
            常见问题: Troubleshooting
  - search:
      # Preserve full terms for Material's prefix queries in the bilingual index.
      pipeline: []
      lang:
        - en
        - zh
hooks:
  - scripts/docs_hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra:
  generator: false
extra_css:
  - stylesheets/extra.css
nav:
  - 首页: index.md
  - 入门:
      - 安装与构建: getting-started/installation.md
      - 账号登录: getting-started/authentication.md
      - 第一个仿真: getting-started/first-simulation.md
  - 使用教程:
      - 模型、状态与仿真循环: guides/simulation-loop.md
      - 刚体、碰撞与关节: guides/rigid-bodies.md
      - 布料与四面体软体: guides/deformables.md
      - 粒子流体与颗粒材料: guides/particles.md
      - 参数调优与性能: guides/configuration.md
      - 示例与渲染: guides/demos.md
  - API:
      - 接口选择与索引: reference/index.md
      - Python 适配层: reference/python.md
      - 原生绑定: reference/native.md
  - 维护:
      - 常见问题: troubleshooting.md
