<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
<rect x="0" y="0" width="1000" height="400" rx="16" fill="#f8fafc"/>
<text x="32" y="40" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#0f172a" text-anchor="start">图 4｜仿射刚体：平移 + 三列矩阵 = 12 个标量自由度</text>
<polygon points="70,240 210,240 210,100 70,100" fill="#dbeafe" stroke="#64748b" stroke-width="2"/>
<text x="80" y="285" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#334155" text-anchor="start">参考局部坐标 X</text>
<polyline points="270,175 420,175" fill="none" stroke="#64748b" stroke-width="2.5"/>
<polygon points="420,175 410.0,170.0 410.0,180.0" fill="#64748b"/>
<text x="283" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#334155" text-anchor="start">x = t + AX</text>
<polygon points="480,265 665,235 720,85 535,115" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/>
<circle cx="480" cy="265" r="6" fill="#2563eb"/>
<polyline points="480,265 650,237" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="650,237 639.3203600431536,233.6916332742378 640.9455226452824,243.5586919300198" fill="#2563eb"/>
<polyline points="480,265 530,125" fill="none" stroke="#0d9488" stroke-width="2.5"/>
<polygon points="530,125 521.9279264720442,132.7357371309576 531.3453455879926,136.09910110093915" fill="#0d9488"/>
<polyline points="480,265 440,210" fill="none" stroke="#9333ea" stroke-width="2.5"/>
<polygon points="440,210 441.8380365552345,221.02821933140712 449.9253973982664,215.14650235465666" fill="#9333ea"/>
<text x="770" y="125" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#334155" text-anchor="start">t：3 个分量</text>
<text x="770" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#334155" text-anchor="start">A：9 个分量</text>
<text x="770" y="235" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#334155" text-anchor="start">SO(3) 约束</text>
<text x="770" y="270" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#334155" text-anchor="start">抑制非刚性形变</text>
<text x="35" y="360" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#334155" text-anchor="start">空间力通过点 Jacobian 映射回广义坐标；刚性模型与惯性模式是不同配置。</text>
</svg>