<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410">
<rect x="0" y="0" width="1000" height="410" rx="16" fill="#f8fafc"/>
<text x="32" y="40" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#0f172a" text-anchor="start">图 3｜三角形膜内：材料方向与三个残差</text>
<polygon points="70,300 390,300 165,105" fill="#dbeafe" stroke="#64748b" stroke-width="2"/>
<circle cx="70" cy="300" r="7" fill="#2563eb"/>
<text x="58" y="330" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#334155" text-anchor="start">x₀</text>
<circle cx="390" cy="300" r="7" fill="#2563eb"/>
<text x="378" y="330" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#334155" text-anchor="start">x₁</text>
<circle cx="165" cy="105" r="7" fill="#2563eb"/>
<text x="153" y="135" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#334155" text-anchor="start">x₂</text>
<polyline points="155,245 305,245" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="305,245 295.0,240.0 295.0,250.0" fill="#2563eb"/>
<text x="250" y="230" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#2563eb" text-anchor="start">a</text>
<polyline points="155,245 202,155" fill="none" stroke="#0d9488" stroke-width="2.5"/>
<polygon points="202,155 192.9389284970566,161.54957885810583 201.80302018471863,166.17860451721825" fill="#0d9488"/>
<text x="215" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#0d9488" text-anchor="start">b</text>
<text x="485" y="110" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#334155" text-anchor="start">a、b 来自参考形函数导数</text>
<text x="485" y="165" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#2563eb" text-anchor="start">经向伸长：|a| − 1</text>
<text x="485" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#0d9488" text-anchor="start">纬向伸长：|b| − 1</text>
<text x="485" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#334155" text-anchor="start">剪切：正则化单位方向的点积</text>
<text x="35" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#334155" text-anchor="start">几何示意：方向与比例仅用于解释；精确正则项、梯度和装配增量见本节公式。</text>
</svg>