  contact_friction: 1.0
  solver_iterations: 30
  linear_iterations: 10
randomization:
  static_friction: [0.3, 1.2]
  dynamic_friction: [0.3, 1.2]
  restitution: [0.0, 0.0]
  base_mass_add: [0.0, 0.0]
  link_mass_scale: [1.0, 1.0]
  base_com: [0.0, 0.0]
