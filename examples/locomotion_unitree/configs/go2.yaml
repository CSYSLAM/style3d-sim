  activation: elu
  init_noise_std: 1.0
  learning_rate: 0.001
  num_learning_epochs: 5
  num_mini_batches: 4
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  schedule: adaptive
  entropy_coef: 0.01

